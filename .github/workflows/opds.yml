name: Build OPDS catalog & deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "books/**"
      - "scripts/**"
      - ".github/workflows/opds.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - name: Generate OPDS catalog
        run: python3 scripts/generate_opds.py "${{ steps.pages.outputs.base_url }}"

      - name: Touch .nojekyll
        run: touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
